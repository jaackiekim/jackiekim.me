<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Wheels -->
  <circle cx="7" cy="22" r="5.5" fill="none" stroke="#cc2222" stroke-width="2"/>
  <circle cx="25" cy="22" r="5.5" fill="none" stroke="#cc2222" stroke-width="2"/>
  <!-- Frame: chainstay bottom -->
  <line x1="7" y1="22" x2="16" y2="22" stroke="#cc2222" stroke-width="2"/>
  <!-- Frame: seat tube -->
  <line x1="16" y1="22" x2="14" y2="13" stroke="#cc2222" stroke-width="2"/>
  <!-- Frame: down tube -->
  <line x1="14" y1="13" x2="22" y2="22" stroke="#cc2222" stroke-width="2"/>
  <!-- Frame: top tube -->
  <line x1="14" y1="13" x2="20" y2="13" stroke="#cc2222" stroke-width="2"/>
  <!-- Fork -->
  <line x1="20" y1="13" x2="25" y2="22" stroke="#cc2222" stroke-width="2"/>
  <!-- Seat -->
  <line x1="12" y1="12" x2="17" y2="12" stroke="#cc2222" stroke-width="2" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="20" y1="13" x2="20" y2="10" stroke="#cc2222" stroke-width="2"/>
  <!-- Handlebar -->
  <line x1="18" y1="10" x2="22" y2="10" stroke="#cc2222" stroke-width="2" stroke-linecap="round"/>
  <!-- Crank/pedal dot -->
  <circle cx="16" cy="22" r="1.5" fill="#cc2222"/>
</svg>
